<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨市 Rain Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=block" rel="stylesheet">
<style>
  :root { --mount: #1d1b19; --mount-text: #cfc6b4; }
  html, body { margin: 0; height: 100%; background: var(--mount); color: var(--mount-text); overflow: hidden; }
  body { display: grid; place-items: center; }
  #stage { width: min(100vw, 50vh); aspect-ratio: 1 / 2; }
  #stage canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<script type="module" src="main.js"></script>
</body>
</html>
