<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月满中秋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0e0e; --fg: #d8d2c6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); display: grid; place-items: center; overflow: hidden; font-family: serif; }
  .stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
</div>
<script type="module">
  import { start } from './main.js';
  const stage = document.getElementById('stage');
  const fonts = Promise.all([
    document.fonts.load('96px "Ma Shan Zheng"', '月满中秋圆'),
  ]);
  Promise.race([fonts, new Promise(res => setTimeout(res, 3000))])
    .catch(() => {})
    .then(() => start(stage, document.getElementById('gl'), document.getElementById('ui')))
    .catch(err => { console.error(err); stage.textContent = 'Не удалось запустить сцену: ' + err.message; });
</script>
</body>
</html>
